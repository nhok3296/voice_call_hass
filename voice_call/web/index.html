<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b1120">
  <base href="./">
  <title>Voice Call - Smart Home Voice Talk</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <main class="card">
      <!-- Header -->
      <header class="header">
        <div class="brand">
          <div class="brand-icon">📞</div>
          <div>
            <h1 class="brand-title">VOICE CALL</h1>
            <div class="brand-sub">Smart Home Voice Talk</div>
          </div>
        </div>
        <button id="themeToggle" class="theme-btn" aria-label="Đổi theme">☀️</button>
      </header>

      <!-- Speaker Selection -->
      <section class="section">
        <div class="section-label">
          <span>Loa nhận cuộc gọi</span>
          <span id="refreshSpeakers" style="cursor:pointer;font-size:14px;" title="Làm mới">🔄</span>
        </div>
        <select id="speakerSelect" aria-label="Chọn loa">
          <option value="">Đang tải danh sách loa...</option>
        </select>
      </section>

      <!-- Volume Slider -->
      <section class="section">
        <div class="section-label">
          <span>Âm lượng phát loa</span>
        </div>
        <div class="volume-box">
          <span style="font-size:18px;">🔊</span>
          <input id="volumeSlider" type="range" min="5" max="100" value="65" aria-label="Âm lượng">
          <span id="volumeDisplay" class="vol-val">65%</span>
        </div>
      </section>

      <!-- Mic Area -->
      <section class="mic-section">
        <div class="pulse-ring"></div>
        <button id="micButton" class="mic-btn" aria-label="Nhấn giữ để nói">
          🎙️
        </button>
        <div id="micHint" class="mic-hint">Nhấn giữ để nói</div>
        <div id="micTimer" class="mic-timer"></div>
      </section>

      <!-- Buttons -->
      <div class="btn-row">
        <button id="cancelBtn" class="btn btn-danger" disabled>
          ❌ Hủy gọi
        </button>
        <button id="stopBtn" class="btn">
          ⏹️ Dừng loa
        </button>
      </div>

      <!-- Status -->
      <div id="statusBox" class="status-box">
        Đang khởi động Voice Call...
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
