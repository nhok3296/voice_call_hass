name: "Voice Call"
description: "Hệ thống đàm thoại một chạm (Push-to-Talk) thông minh cho loa Google Cast"
url: "https://github.com/nhok3296/voice_call_hass"
version: "1.0.2"
slug: "voice_call"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
boot: auto
homeassistant_api: true
homeassistant_role: admin
ingress: true
ingress_port: 8099
panel_icon: "mdi:phone-in-talk"
panel_title: "Voice Call"
ports:
  8098/tcp: 8098
ports_description:
  8098/tcp: "Cổng phát âm thanh trực tiếp cho Google Cast (HTTP)"
map:
  - media:rw
  - share:rw
options:
  ha_token: ""
  audio_bitrate: "96k"
  max_record_seconds: 120
  retention_hours: 2
  default_volume: 0.65
schema:
  ha_token: "password?"
  audio_bitrate: "list(64k|96k|128k|192k)"
  max_record_seconds: "int(10,300)"
  retention_hours: "int(1,48)"
  default_volume: "float(0.05,1.0)"
